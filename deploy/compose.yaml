services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: transfercar
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: transfercar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfercar -d transfercar"]
      interval: 5s
      timeout: 5s
      retries: 10
  dashboard:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql://transfercar:local_dev_only@db:5432/transfercar
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
