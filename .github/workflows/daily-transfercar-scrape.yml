name: Daily Transfercar Scrape

on:
  schedule:
    # Runs daily at 00:10 UTC.
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-transfercar-scrape
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate scraper
        run: python -m py_compile scrape_transfercar.py

      - name: Run scraper
        run: |
          mkdir -p data
          python scrape_transfercar.py \
            --output data/transfercar_listings_daily.csv \
            --year "$(date -u +%Y)"

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: transfercar-listings-daily
          path: data/transfercar_listings_daily.csv

      - name: Commit and push CSV changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transfercar_listings_daily.csv

          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi

          git commit -m "chore(data): update transfercar listings ($(date -u +'%Y-%m-%d'))"
          git push