name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: transfercar
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: transfercar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U transfercar -d transfercar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://transfercar:test_only@localhost:5432/transfercar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: docker build -f deploy/Dockerfile -t transfercar:ci .
